<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Random Number Generator | MathVision Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0c0a19;
            color: #fff;
            margin: 0;
            min-height: 100vh;
        }
        nav {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(12px);
            box-shadow: 0 2px 10px rgba(128,0,255,0.5);
            position: sticky;
            top: 0;
            z-index: 40;
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #ddd;
        }
        nav a {
            color: #ddd;
            text-decoration: none;
            margin-left: 1rem;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #e100ff;
        }
        .gradient-text {
            background: linear-gradient(90deg, #8000ff, #e100ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #2c0735 0%, #1c0631 50%, #16052b 100%);
            padding: 4rem 1rem 2rem 1rem;
            text-align: center;
        }
        .feature-card {
            background: rgba(255,255,255,0.05);
            border-radius: 2rem;
            padding: 2rem 2.5rem;
            box-shadow: 0 8px 48px 0 #8000ff33;
            margin-bottom: 2rem;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            background: linear-gradient(90deg, #8000ff, #e100ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        label {
            display: block;
            margin: 1rem 0 0.3rem 0;
            font-weight: 500;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 0.7rem;
            border-radius: 0.5rem;
            border: 1px solid #e100ff33;
            background: rgba(255,255,255,0.07);
            color: #fff;
            font-size: 1.1rem;
        }
        input[type="number"]:focus, input[type="text"]:focus {
            outline: 2px solid #e100ff;
            background: rgba(255,255,255,0.12);
        }
        .btn-primary {
            margin-top: 1.2rem;
            width: 100%;
            padding: 0.8rem 0;
            border: none;
            border-radius: 0.6rem;
            background: linear-gradient(90deg, #8000ff, #e100ff);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow 0.3s;
            box-shadow: 0 4px 20px -1px #8000ff44;
        }
        .btn-primary:hover {
            box-shadow: 0 8px 32px -2px #e100ff55;
        }
        .output {
            background: rgba(255,255,255,0.07);
            border-radius: 0.7rem;
            padding: 1rem;
            margin-top: 1.5rem;
            box-shadow: 0 2px 12px 0 #8000ff22;
            font-size: 1.08rem;
            line-height: 1.5;
            word-break: break-all;
        }
        .histogram {
            display: flex;
            align-items: flex-end;
            height: 120px;
            margin-top: 1.2rem;
            gap: 2px;
        }
        .bar {
            background: linear-gradient(90deg, #8000ff, #e100ff);
            width: 14px;
            border-radius: 2px 2px 0 0;
            transition: background 0.3s;
        }
        .stats {
            margin-top: 1rem;
            font-size: 1.1rem;
        }
        .alert {
            background: #ff6b6b;
            color: #fff;
            padding: 0.7rem 1rem;
            border-radius: 0.6rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        @media (max-width: 600px) {
            .feature-card { padding: 1.1rem 0.7rem; }
            .histogram { height: 80px; }
            .bar { width: 8px; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div style="display:flex; align-items:center; gap:0.5rem;">
            <svg width="30" height="30" viewBox="0 0 100 100" fill="none" stroke="#e100ff" stroke-width="4" style="flex-shrink:0;">
                <circle cx="50" cy="50" r="40" fill="none" />
                <path d="M30,50 L45,65 L70,35" stroke="#8000ff" stroke-width="6" fill="none"/>
            </svg>
            <span class="gradient-text" style="font-size:1.25rem;">MathVision Pro</span>
        </div>
        <div>
            <a href="home.html">Home</a>
            <a href="calculator.html" style="background: linear-gradient(90deg, #8000ff, #e100ff); padding: 0.4rem 0.8rem; border-radius: 0.5rem; font-weight: 700; color: white; margin-left: 1rem;">Launch Calculator</a>
        </div>
    </nav>

    <!-- Header -->
    <div class="hero-gradient">
        <div class="max-w-7xl text-center">
            <h1 class="gradient-text" style="font-size: 2.5rem; font-weight: 800; margin: 0;">Random Number Generator</h1>
            <p class="max-w-2xl mx-auto text-lg md:text-xl" style="color:#e9d5ff;">
                Instantly generate random numbers, compute mean & variance, and visualize the distribution!
            </p>
        </div>
    </div>

    <!-- Main Calculator -->
    <div class="feature-card" style="margin-top:2rem;">
        <h2>Random Number Generator</h2>
        <label for="n">How many numbers?</label>
        <input id="n" type="number" min="1" max="100" value="10">
        <label for="min">Min value:</label>
        <input id="min" type="number" value="1">
        <label for="max">Max value:</label>
        <input id="max" type="number" value="100">
        <label for="seed">Seed (optional):</label>
        <input id="seed" type="text" placeholder="leave blank for random">
        <button class="btn-primary" onclick="generate()">
            <span style="margin-right:0.5em;">&#127922;</span>Generate
        </button>
        <div class="alert" id="alert" style="display:none;"></div>
        <div class="output" id="output"></div>
        <div class="histogram" id="histogram"></div>
    </div>

    <script>
        // Simple seedable random
        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }
        function generate() {
            const n = parseInt(document.getElementById('n').value);
            const min = parseInt(document.getElementById('min').value);
            const max = parseInt(document.getElementById('max').value);
            const seedInput = document.getElementById('seed').value;
            const alertBox = document.getElementById('alert');
            if (isNaN(n) || isNaN(min) || isNaN(max) || n < 1 || min > max) {
                alertBox.textContent = 'Please enter valid inputs.';
                alertBox.style.display = '';
                document.getElementById('output').innerHTML = '';
                document.getElementById('histogram').innerHTML = '';
                return;
            } else {
                alertBox.style.display = 'none';
            }
            let rand = Math.random;
            if (seedInput) {
                let hash = 0;
                for (let i = 0; i < seedInput.length; i++) {
                    hash = ((hash << 5) - hash) + seedInput.charCodeAt(i);
                    hash |= 0;
                }
                rand = mulberry32(hash);
            }
            let nums = [];
            for (let i = 0; i < n; i++) {
                nums.push(Math.floor(rand() * (max - min + 1)) + min);
            }
            // Stats
            let mean = nums.reduce((a,b) => a + b, 0) / n;
            let variance = nums.reduce((a,b) => a + Math.pow(b - mean,2), 0) / n;
            document.getElementById('output').innerHTML =
                `<div><strong>Numbers:</strong> ${nums.join(', ')}</div>
                <div class="stats"><strong>Mean:</strong> ${mean.toFixed(3)} &nbsp; <strong>Variance:</strong> ${variance.toFixed(3)}</div>`;
            // Histogram
            let bins = Math.min(10, max-min+1);
            let binSize = Math.ceil((max-min+1)/bins);
            let hist = Array(bins).fill(0);
            nums.forEach(num => {
                let idx = Math.min(Math.floor((num-min)/binSize), bins-1);
                hist[idx]++;
            });
            let maxCount = Math.max(...hist);
            document.getElementById('histogram').innerHTML = hist.map((count, i) => {
                let binLabel = `${min + i*binSize}${binSize>1?'-'+Math.min(max, min+(i+1)*binSize-1):''}`;
                return `<div class="bar" title="${binLabel}: ${count}" style="height:${(count/maxCount)*100}px"></div>`;
            }).join('');
        }
    </script>
</body>
</html>
