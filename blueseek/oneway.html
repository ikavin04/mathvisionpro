<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>One Way ANOVA - Table Format Result</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: 'Space Grotesk', sans-serif;
    background-color: #0c0a19;
    color: #fff;
    margin: 0;
    min-height: 100vh;
  }
  .container {
    max-width: 540px;
    margin: 60px auto;
    background: linear-gradient(135deg, #2c0735 0%, #1c0631 50%, #16052b 100%);
    border-radius: 2rem;
    padding: 2.2rem 2.5rem 2rem 2.5rem;
    box-shadow: 0 8px 48px 0 #8000ff33;
  }
  h2 {
    text-align: center;
    margin-bottom: 1.5rem;
    background: linear-gradient(90deg, #8000ff, #e100ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: 2.2rem;
    font-weight: 700;
  }
  label {
    display: block;
    margin: 1rem 0 0.3rem 0;
    font-weight: 500;
  }
  textarea {
    width: 100%;
    min-height: 60px;
    padding: 0.7rem;
    border-radius: 0.5rem;
    border: 1px solid #e100ff33;
    background: rgba(255,255,255,0.07);
    color: #fff;
    font-size: 1.1rem;
    margin-bottom: 1rem;
    resize: vertical;
  }
  select {
    background: rgba(255,255,255,0.07);
    border: 1px solid #e100ff33;
    color: #fff;
    font-size: 1.05rem;
    border-radius: 0.5rem;
    padding: 0.4rem 1rem;
    margin-bottom: 1rem;
    margin-left: 0.5rem;
  }
  .btn-primary {
    margin-top: 1.2rem;
    width: 100%;
    padding: 0.8rem 0;
    border: none;
    border-radius: 0.6rem;
    background: linear-gradient(90deg, #8000ff, #e100ff);
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: box-shadow 0.3s;
    box-shadow: 0 4px 20px -1px #8000ff44;
  }
  .btn-primary:hover {
    box-shadow: 0 8px 32px -2px #e100ff55;
  }
  .output {
    background: rgba(255,255,255,0.07);
    border-radius: 0.7rem;
    padding: 1rem;
    margin-top: 1.5rem;
    box-shadow: 0 2px 12px 0 #8000ff22;
    font-size: 1rem;
    line-height: 1.4;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
  }
  th, td {
    border: 1px solid #e100ff33;
    padding: 0.6rem 0.8rem;
    text-align: center;
  }
  th {
    background: linear-gradient(90deg, #8000ff, #e100ff);
    color: #fff;
  }
  .decision {
    font-weight: 700;
    margin-top: 1rem;
    font-size: 1.15rem;
  }
  .reject {
    color: #ff6bcb;
  }
  .accept {
    color: #00e8c6;
  }
  .note {
    margin-top: 0.7rem;
    font-size: 0.9rem;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>One Way Classification ANOVA</h2>
    <label>Enter group data (comma separated, one group per line):</label>
    <textarea id="data" placeholder="e.g.&#10;5,7,8,6&#10;6,9,7,8&#10;8,8,9,10"></textarea>
    <label>Significance level (%):
      <select id="alpha">
        <option value="5">5%</option>
        <option value="1">1%</option>
      </select>
    </label>
    <button class="btn-primary" onclick="calculate()">Calculate</button>
    <div class="output" id="result" style="display:none;"></div>
  </div>

<script>
  // Critical F-values for α = 0.05
  const fTable05 = {
    1: {1:161.4,2:18.51,3:10.13,4:7.71,5:6.61,6:5.99,7:5.59,8:5.32,9:5.12,10:4.96,12:4.75,15:4.54,20:4.35,24:4.26,30:4.17,40:4.08,60:4.00,120:3.92,Infinity:3.84},
    2: {1:199.5,2:19.00,3:9.55,4:6.94,5:5.79,6:5.14,7:4.74,8:4.46,9:4.26,10:4.10,12:3.89,15:3.68,20:3.49,24:3.40,30:3.32,40:3.23,60:3.15,120:3.07,Infinity:3.00},
    3: {1:215.7,2:19.16,3:9.28,4:6.59,5:5.41,6:4.76,7:4.35,8:4.07,9:3.86,10:3.71,12:3.49,15:3.29,20:3.10,24:3.01,30:2.92,40:2.84,60:2.76,120:2.68,Infinity:2.60},
    4: {1:224.6,2:19.25,3:9.12,4:6.39,5:5.19,6:4.53,7:4.12,8:3.84,9:3.63,10:3.48,12:3.26,15:3.06,20:2.87,24:2.78,30:2.69,40:2.61,60:2.53,120:2.45,Infinity:2.37},
    5: {1:230.2,2:19.30,3:9.01,4:6.26,5:5.05,6:4.39,7:3.97,8:3.69,9:3.48,10:3.33,12:3.11,15:2.90,20:2.71,24:2.62,30:2.53,40:2.45,60:2.37,120:2.29,Infinity:2.21},
    6: {1:234.0,2:19.33,3:8.94,4:6.16,5:4.95,6:4.28,7:3.87,8:3.58,9:3.37,10:3.22,12:3.00,15:2.79,20:2.60,24:2.51,30:2.42,40:2.34,60:2.25,120:2.17,Infinity:2.10},
    7: {1:236.8,2:19.35,3:8.89,4:6.09,5:4.88,6:4.21,7:3.79,8:3.50,9:3.29,10:3.14,12:2.91,15:2.71,20:2.51,24:2.42,30:2.33,40:2.25,60:2.17,120:2.09,Infinity:2.01},
    8: {1:238.9,2:19.37,3:8.85,4:6.04,5:4.82,6:4.15,7:3.73,8:3.44,9:3.23,10:3.07,12:2.85,15:2.64,20:2.45,24:2.36,30:2.27,40:2.18,60:2.10,120:2.02,Infinity:1.94},
    9: {1:240.5,2:19.38,3:8.81,4:6.00,5:4.77,6:4.10,7:3.68,8:3.39,9:3.18,10:3.02,12:2.80,15:2.59,20:2.39,24:2.30,30:2.21,40:2.12,60:2.04,120:1.96,Infinity:1.88},
    10:{1:241.9,2:19.40,3:8.79,4:5.96,5:4.74,6:4.06,7:3.64,8:3.35,9:3.14,10:2.98,12:2.75,15:2.54,20:2.35,24:2.25,30:2.16,40:2.08,60:1.99,120:1.91,Infinity:1.83}
  };

  // Critical F-values for α = 0.01 (1%)
  const fTable01 = {
    1: {1:4052,2:98.50,3:34.12,4:21.20,5:16.26,6:13.75,7:12.25,8:11.26,9:10.56,10:10.04,12:9.33,15:8.68,20:8.10,24:7.82,30:7.56,40:7.31,60:7.08,120:6.85,Infinity:6.63},
    2: {1:4999,2:99.00,3:30.82,4:18.00,5:13.27,6:10.92,7:9.55,8:8.65,9:8.02,10:7.56,12:6.93,15:6.36,20:5.85,24:5.61,30:5.39,40:5.18,60:4.98,120:4.79,Infinity:4.61},
    3: {1:5403,2:99.17,3:29.46,4:16.69,5:12.06,6:9.78,7:8.45,8:7.59,9:6.99,10:6.55,12:5.95,15:5.42,20:4.94,24:4.72,30:4.51,40:4.31,60:4.13,120:3.95,Infinity:3.78},
    4: {1:5625,2:99.25,3:28.71,4:15.98,5:11.39,6:9.15,7:7.85,8:7.01,9:6.42,10:5.99,12:5.41,15:4.89,20:4.43,24:4.22,30:4.02,40:3.83,60:3.65,120:3.48,Infinity:3.32},
    5: {1:5764,2:99.30,3:28.24,4:15.52,5:10.97,6:8.75,7:7.46,8:6.63,9:6.06,10:5.64,12:5.06,15:4.56,20:4.10,24:3.90,30:3.70,40:3.51,60:3.34,120:3.17,Infinity:3.02},
    6: {1:5859,2:99.33,3:27.91,4:15.21,5:10.67,6:8.47,7:7.19,8:6.37,9:5.80,10:5.39,12:4.82,15:4.32,20:3.87,24:3.67,30:3.47,40:3.29,60:3.12,120:2.96,Infinity:2.80},
    7: {1:5928,2:99.36,3:27.67,4:14.98,5:10.46,6:8.26,7:6.99,8:6.18,9:5.61,10:5.20,12:4.65,15:4.14,20:3.70,24:3.50,30:3.30,40:3.12,60:2.95,120:2.79,Infinity:2.64},
    8: {1:5982,2:99.37,3:27.49,4:14.80,5:10.29,6:8.10,7:6.84,8:6.03,9:5.47,10:5.06,12:4.50,15:4.00,20:3.56,24:3.36,30:3.17,40:2.99,60:2.82,120:2.66,Infinity:2.51},
    9: {1:6022,2:99.39,3:27.35,4:14.66,5:10.16,6:7.98,7:6.72,8:5.91,9:5.35,10:4.94,12:4.39,15:3.89,20:3.46,24:3.26,30:3.07,40:2.89,60:2.72,120:2.56,Infinity:2.41},
    10:{1:6056,2:99.40,3:27.23,4:14.55,5:10.05,6:7.87,7:6.62,8:5.81,9:5.26,10:4.85,12:4.30,15:3.80,20:3.37,24:3.17,30:2.98,40:2.80,60:2.63,120:2.47,Infinity:2.32}
  };

  // Helper: find nearest df key less or equal to given df
  function findNearestKey(df, keys) {
    const numKeys = keys.map(Number).filter(k => !isNaN(k));
    if (df >= Math.max(...numKeys)) return Math.max(...numKeys);
    if (df <= Math.min(...numKeys)) return Math.min(...numKeys);
    let nearest = Math.min(...numKeys);
    for (let key of numKeys) {
      if (key <= df && key > nearest) nearest = key;
    }
    return nearest;
  }

  // Get critical F value from table using numerator and denominator df
  function getCriticalFValue(dfNumerator, dfDenominator, alpha) {
    const table = alpha === 5 ? fTable05 : fTable01;
    const numeratorKeys = Object.keys(table);
    const nearestNum = findNearestKey(dfNumerator, numeratorKeys);
    const denominatorKeys = Object.keys(table[nearestNum]);
    const nearestDen = findNearestKey(dfDenominator, denominatorKeys);
    return table[nearestNum][nearestDen];
  }

  function calculate() {
    const dataText = document.getElementById('data').value.trim();
    const alpha = parseInt(document.getElementById('alpha').value);
    const output = document.getElementById('result');

    const groups = dataText.split('\n')
      .map(line => line.split(',')
        .map(num => parseFloat(num.trim()))
        .filter(x => !isNaN(x))
      )
      .filter(group => group.length > 0);

    const k = groups.length;
    const n = groups.reduce((acc, g) => acc + g.length, 0);

    if (k < 2 || n <= k) {
      output.style.display = 'block';
      output.innerHTML = '<span style="color:#ff6bcb;">Please enter at least two groups with sufficient data points.</span>';
      return;
    }

    // Calculate group means and overall mean
    const groupMeans = groups.map(g => g.reduce((a,b) => a+b,0)/g.length);
    const allValues = groups.flat();
    const overallMean = allValues.reduce((a,b) => a+b,0) / n;

    // Sum of Squares Between
    let SSBetween = 0;
    groups.forEach((group,i) => {
      SSBetween += group.length * Math.pow(groupMeans[i] - overallMean, 2);
    });

    // Sum of Squares Within
    let SSWithin = 0;
    groups.forEach((group,i) => {
      group.forEach(val => {
        SSWithin += Math.pow(val - groupMeans[i], 2);
      });
    });

    // Degrees of freedom
    const dfBetween = k - 1;
    const dfWithin = n - k;

    // Mean Squares
    const MSBetween = SSBetween / dfBetween;
    const MSWithin = SSWithin / dfWithin;

    // Calculate F-ratio as ratio of larger MS to smaller MS
    let F, numeratorDF, denominatorDF, ratioSource;
    if (MSBetween >= MSWithin) {
      F = MSBetween / MSWithin;
      numeratorDF = dfBetween;
      denominatorDF = dfWithin;
      ratioSource = "Between / Within";
    } else {
      F = MSWithin / MSBetween;
      numeratorDF = dfWithin;
      denominatorDF = dfBetween;
      ratioSource = "Within / Between";
    }

    // Get critical F value from table with correct DF order
    const FCritical = getCriticalFValue(numeratorDF, denominatorDF, alpha);

    // Hypothesis decision
    const decision = F >= FCritical ? 'Reject the null hypothesis' : 'Fail to reject the null hypothesis';
    const decisionClass = F >= FCritical ? 'reject' : 'accept';

    // Display results
    output.style.display = 'block';
    output.innerHTML = `
      <table>
        <tr>
          <th>Source of Variation</th>
          <th>Sum of Squares (SS)</th>
          <th>Degrees of Freedom (df)</th>
          <th>Mean Square (MS)</th>
          <th>F-ratio</th>
        </tr>
        <tr>
          <td>Between Groups</td>
          <td>${SSBetween.toFixed(4)}</td>
          <td>${dfBetween}</td>
          <td>${MSBetween.toFixed(4)}</td>
          <td rowspan="2">${F.toFixed(4)}<br><small style="font-weight:normal;">(${ratioSource})</small></td>
        </tr>
        <tr>
          <td>Within Groups</td>
          <td>${SSWithin.toFixed(4)}</td>
          <td>${dfWithin}</td>
          <td>${MSWithin.toFixed(4)}</td>
        </tr>
      </table>
      <div class="decision ${decisionClass}">
        ${decision} <br>
        (Calculated F: ${F.toFixed(4)}, Critical F: ${FCritical.toFixed(4)} at F(${numeratorDF}, ${denominatorDF}))
      </div>
      <div class="note">
        F-table lookup uses F(${numeratorDF}, ${denominatorDF}) at significance level α = 0.${alpha.toString().padStart(2,'0')}
      </div>
      <div class="note" style="margin-top:0.5rem;">
        <div>
          <b>Interpretation:</b><br />
          If Calculated F &lt; Table F, we <span class="accept">accept H&lt;sub&gt;0&lt;/sub&gt;</span> (no significant difference).<br />
          If Calculated F &ge; Table F, we <span class="reject">reject H&lt;sub&gt;0&lt;/sub&gt;</span> (significant difference exists).<br />
          <br />
          <b>In this case:</b> Calculated F = <b>${F.toFixed(4)}</b> and Table F = <b>${FCritical.toFixed(4)}</b>.<br />
          <b>Since</b> ${F.toFixed(4)} ${F < FCritical ? "&lt;" : "&ge;"} ${FCritical.toFixed(4)}, we <span class="${F < FCritical ? "accept" : "reject"}">${F < FCritical ? "accept" : "reject"} H&lt;sub&gt;0&lt;/sub&gt;</span>.
        </div>
      </div>
    `;
  }
</script>
</body>
</html>
